<!doctype html>
<meta charset="utf-8">
<title>The Socratic Coach</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  A window onto the agent, not the agent. Everything this page does is: show
  what came back, take what you type, POST it to coach.py. All the thinking
  happens in the Python. Deleting this file loses you a view, not a mind.

  That goes for the works panel too. This page does not know what a layer is,
  what order they run in, or which ones aren't built — it draws the list and
  the lines coach.py sends it. The stack is described where the stack is real.
-->
<style>
  :root {
    --paper: #fbfaf8; --ink: #1a1a18; --muted: #6b6b66;
    --line: #e6e3dd; --accent: #0e7490;
    --warn-ink: #92400e; --warn-bg: #fef3c7; --warn-line: #fde68a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 18px 24px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 1rem; font-weight: 650; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .82rem; }
  .build {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .72rem; color: #a3a099;
  }
  .pill {
    font-size: .7rem; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; border-radius: 999px; padding: 4px 11px;
  }
  #flag {
    display: none; color: var(--warn-ink);
    background: var(--warn-bg); border: 1px solid var(--warn-line);
  }
  #works, #done, #quit {
    font: inherit; font-size: .82rem; color: var(--muted);
    background: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 13px; cursor: pointer;
  }
  #works { margin-left: auto; }
  #works:hover, #done:hover, #quit:hover { color: var(--ink); border-color: var(--muted); }
  #quit { padding: 5px 11px; }
  #main { flex: 1; display: flex; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 28px 24px 8px; }
  .wrap { max-width: 620px; margin: 0 auto; }
  .turn { margin: 0 0 26px; }
  .who {
    font-size: .68rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .coach .what { font-size: 1.22rem; line-height: 1.45; letter-spacing: -.011em; }
  .me .what { color: var(--muted); }
  .flagged .what {
    border-left: 3px solid #d97706; padding-left: 13px; font-size: 1rem;
  }
  .flagged .who { color: var(--warn-ink); }
  .thinking { color: var(--muted); font-style: italic; }
  footer { border-top: 1px solid var(--line); padding: 14px 24px 20px; }
  form { max-width: 620px; margin: 0 auto; display: flex; gap: 10px; }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit; padding: 11px 14px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    min-height: 48px; max-height: 180px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send {
    font: inherit; font-weight: 600; padding: 0 20px; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
  }
  button.send:disabled { background: #b8b5ae; cursor: default; }

  /* --- the works: the spine, and the trace running down beside it --- */
  #rail {
    width: 400px; flex: none; min-height: 0; background: #f7f6f3;
    border-left: 1px solid var(--line); display: flex; flex-direction: column;
  }
  body.no-works #rail { display: none; }
  @media (max-width: 900px) { #rail { width: 320px; } }
  @media (max-width: 720px) { #rail { display: none; } }

  .rail-h {
    font-size: .66rem; font-weight: 750; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 9px;
  }
  #spine { flex: none; padding: 18px 16px 14px; border-bottom: 1px solid var(--line); }
  .layer {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px;
    padding: 4px 8px; border-radius: 7px;
    border-left: 2px solid transparent; transition: background .5s ease;
  }
  .layer .id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .71rem; font-weight: 700; color: var(--muted); width: 1.8em;
  }
  .layer .nm { font-size: .85rem; }
  .layer .n {
    margin-left: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .69rem; color: var(--muted);
  }
  .layer.lit { background: #fff; border-left-color: var(--accent); }
  .layer.lit .id { color: var(--accent); }
  .layer.pulse { animation: pulse .9s ease-out; }
  @keyframes pulse { from { background: #cffafe; border-left-color: var(--accent); } }
  .layer.off { opacity: .5; }
  .layer.off .nm { text-decoration: line-through; text-decoration-thickness: 1px; }
  .layer .why-off {
    flex-basis: 100%; margin: 0 0 1px 2.4em;
    font-size: .71rem; line-height: 1.35; color: var(--muted); font-style: italic;
  }

  #trace { flex: 1; overflow-y: auto; padding: 6px 16px 24px; min-height: 0; }
  .turnhead {
    font-size: .66rem; font-weight: 750; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
    margin: 16px 0 5px; padding-top: 10px; border-top: 1px solid var(--line);
  }
  #trace .turnhead:first-child { border-top: 0; margin-top: 8px; padding-top: 0; }
  .ev {
    display: flex; gap: 8px; align-items: baseline;
    padding: 3px 7px; border-radius: 6px; font-size: .79rem; line-height: 1.45;
  }
  .ev .id {
    flex: none; width: 1.8em; font-weight: 700; font-size: .69rem;
    color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .ev .ev-name { color: var(--muted); }
  .ev.has { cursor: pointer; }
  .ev.has:hover { background: #fff; }
  .ev.has .ev-line::after { content: ' ⌄'; color: var(--muted); }
  .detail {
    font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #fff; border: 1px solid var(--line); border-radius: 7px;
    padding: 9px 11px; margin: 2px 0 8px 2.5em;
    white-space: pre-wrap; word-break: break-word;
    max-height: 300px; overflow: auto;
  }
  .rail-note {
    font-size: .72rem; line-height: 1.5; color: var(--muted);
    font-style: italic; margin: 10px 0 0;
  }

  /* --- the closing panel: what was kept, and what it wants to become --- */
  .panel {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin: 0 0 26px;
  }
  .panel h2 {
    margin: 0 0 10px; font-size: .7rem; font-weight: 750; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted);
  }
  .panel p { margin: 0 0 12px; font-size: .95rem; }
  .kept { font-size: .84rem; color: var(--muted); }
  .diff {
    font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #f7f6f3; border-radius: 8px; padding: 11px 13px; margin: 4px 0 12px;
    white-space: pre-wrap; word-break: break-word;
  }
  .diff .minus { color: #9f1239; }
  .diff .plus { color: #14532d; }
  .why { font-size: .87rem; color: var(--muted); margin: 0 0 14px; font-style: italic; }
  .choose { display: flex; gap: 10px; }
  .choose button {
    font: inherit; font-size: .9rem; font-weight: 600; padding: 8px 18px;
    border-radius: 9px; cursor: pointer; border: 1px solid var(--line);
    background: #fff; color: var(--ink);
  }
  .choose .approve { background: var(--accent); border-color: var(--accent); color: #fff; }
  .settled { font-size: .9rem; color: var(--muted); margin: 0; }
</style>

<header>
  <h1>The Socratic Coach</h1>
  <span class="sub">it asks · you answer · it never tells</span>
  <span class="sub build" id="build" title="which build is running"></span>
  <span id="flag" class="pill">off the record</span>
  <button id="works" type="button" title="Show what each layer just did">Hide the works</button>
  <button id="done" type="button">End session</button>
  <button id="quit" type="button" title="Stop the coach running">Quit</button>
</header>

<div id="main">
  <div id="log"><div class="wrap" id="turns"></div></div>
  <aside id="rail">
    <div id="spine">
      <p class="rail-h">The stack</p>
      <div id="layers"></div>
    </div>
    <div id="trace">
      <p class="rail-note">Nothing has run yet. Each turn, every layer that
        does something says so here.</p>
    </div>
  </aside>
</div>

<footer>
  <form id="form">
    <textarea id="say" rows="1" placeholder="Type your reply…" autofocus></textarea>
    <button id="send" class="send" type="submit">Send</button>
  </form>
</footer>

<script>
  const turns = document.getElementById('turns');
  const form = document.getElementById('form');
  const say = document.getElementById('say');
  const send = document.getElementById('send');
  const done = document.getElementById('done');
  const flag = document.getElementById('flag');
  const log = document.getElementById('log');

  const scroll = () => { log.scrollTop = log.scrollHeight; };

  function add(who, what, cls = '') {
    const el = document.createElement('div');
    el.className = 'turn ' + cls;
    el.innerHTML = '<div class="who"></div><div class="what"></div>';
    el.querySelector('.who').textContent = who;
    el.querySelector('.what').textContent = what;
    turns.appendChild(el);
    scroll();
    return el;
  }

  async function post(path, payload) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload || {})
    });
    return res.json();
  }

  // --- the works: the spine, and the trace ---------------------------------
  // Nothing about the stack is decided here. coach.py sends the list of layers
  // and the lines they emit; this just draws them.
  const layersEl = document.getElementById('layers');
  const traceEl = document.getElementById('trace');
  const fired = {};
  let turnNo = 0;

  fetch('/stack').then(r => r.json()).then(stack => {
    layersEl.textContent = '';
    stack.forEach(l => {
      const row = document.createElement('div');
      row.className = 'layer' + (l.built ? '' : ' off');
      row.id = 'layer-' + l.id;
      row.title = l.note;
      const id = document.createElement('span');
      id.className = 'id'; id.textContent = l.id;
      const nm = document.createElement('span');
      nm.className = 'nm'; nm.textContent = l.name;
      const n = document.createElement('span');
      n.className = 'n';
      row.append(id, nm, n);
      // The built layers explain themselves by lighting up. The unbuilt ones
      // can't, so they say why in words — an absence you can read.
      if (!l.built) {
        const why = document.createElement('div');
        why.className = 'why-off'; why.textContent = l.note;
        row.appendChild(why);
      }
      layersEl.appendChild(row);
    });
  }).catch(() => {});

  function light(id) {
    const row = document.getElementById('layer-' + id);
    if (!row) return;
    fired[id] = (fired[id] || 0) + 1;
    row.querySelector('.n').textContent = fired[id];
    row.classList.add('lit');
    row.classList.remove('pulse');
    void row.offsetWidth;          // restart the animation on a repeat hit
    row.classList.add('pulse');
  }

  // A replay, not a live feed: the turn is over by the time these arrive in
  // one response. The timings in the lines are the real ones — the pacing is
  // only so the order is readable rather than appearing all at once.
  function drawTrace(events, label) {
    if (!events || !events.length) return;
    const note = traceEl.querySelector('.rail-note');
    if (note) note.remove();
    const head = document.createElement('p');
    head.className = 'turnhead';
    head.textContent = label || 'turn ' + (++turnNo);
    traceEl.appendChild(head);

    events.forEach((e, i) => setTimeout(() => {
      const row = document.createElement('div');
      row.className = 'ev' + (e.detail ? ' has' : '');
      const id = document.createElement('span');
      id.className = 'id'; id.textContent = e.layer;
      const line = document.createElement('span');
      line.className = 'ev-line';
      const name = document.createElement('span');
      name.className = 'ev-name'; name.textContent = e.event + ' — ';
      line.append(name, document.createTextNode(e.line));
      row.append(id, line);

      // Click any line with a detail to see the actual thing: the whole
      // context that went out, the raw reply that came back, the file as
      // rewritten. textContent throughout — none of this is ever HTML.
      if (e.detail) {
        row.addEventListener('click', () => {
          const open = row.nextElementSibling;
          if (open && open.classList.contains('detail')) { open.remove(); return; }
          const pre = document.createElement('pre');
          pre.className = 'detail';
          pre.textContent = e.detail;
          row.after(pre);
        });
      }
      traceEl.appendChild(row);
      light(e.layer);
      traceEl.scrollTop = traceEl.scrollHeight;
    }, i * 70));
  }

  // Only the preference is remembered. The trace itself never goes to
  // localStorage, or anywhere else it could outlive the tab — it can contain
  // off-record words, and off the record has to mean it.
  const works = document.getElementById('works');
  function setWorks(on) {
    document.body.classList.toggle('no-works', !on);
    works.textContent = on ? 'Hide the works' : 'Show the works';
    localStorage.setItem('coach-works', on ? '1' : '0');
  }
  works.addEventListener('click',
    () => setWorks(document.body.classList.contains('no-works')));
  setWorks(localStorage.getItem('coach-works') !== '0');

  async function speak(said) {
    send.disabled = true;
    const waiting = add('coach', 'thinking…', 'coach thinking');
    try {
      const move = await post('/say', { said });
      waiting.remove();
      add('coach', move.ask, 'coach' + (move.flagged ? ' flagged' : ''));
      if (move.off_record) flag.style.display = 'inline-block';
      drawTrace(move.trace);
    } catch (err) {
      waiting.remove();
      add('coach', "The coach isn't answering — is its window still open?",
          'coach flagged');
    }
    send.disabled = false;
    say.focus();
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const said = say.value.trim();
    if (!said) return;
    add('you', said, 'me');
    say.value = '';
    speak(said);
  });

  // Enter sends, Shift+Enter makes a new line — a coaching reply is short.
  say.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  // --- ending: only ever from this button. The coach can propose; you decide.
  done.addEventListener('click', async () => {
    done.disabled = send.disabled = true;
    const waiting = add('coach', 'closing the session…', 'coach thinking');
    const out = await post('/end');
    waiting.remove();
    closingPanel(out);
    drawTrace(out.trace, 'closing the session');
  });

  function closingPanel(out) {
    const panel = document.createElement('div');
    panel.className = 'panel';

    const kept = out.off_record
      ? 'You went off the record, so nothing from that point was written down — ' +
        'and none of it was shown to the model that wrote this summary.'
      : (out.wrote && out.wrote.length
          ? 'Written to ' + out.wrote.join(' and ') + '.'
          : 'Nothing worth keeping was written.');

    panel.innerHTML = `
      <h2>Session closed</h2>
      <p class="summary"></p>
      <p class="kept"></p>`;
    panel.querySelector('.summary').textContent = out.summary || '(no summary)';
    panel.querySelector('.kept').textContent = kept;

    const edit = out.edit || {};
    if (edit.add) {
      const box = document.createElement('div');
      box.innerHTML = `
        <h2 style="margin-top:20px">It wants to change its own instructions</h2>
        <div class="diff"></div>
        <p class="why"></p>
        <div class="choose">
          <button class="approve">Approve</button>
          <button class="veto">Veto</button>
        </div>`;
      const diff = box.querySelector('.diff');
      if (edit.remove) {
        const m = document.createElement('div');
        m.className = 'minus'; m.textContent = '- ' + edit.remove;
        diff.appendChild(m);
      }
      const p = document.createElement('div');
      p.className = 'plus'; p.textContent = '+ ' + edit.add;
      diff.appendChild(p);
      box.querySelector('.why').textContent = edit.why || '';

      box.querySelector('.approve').addEventListener('click', async () => {
        drawTrace((await post('/approve', { edit })).trace, 'the second loop');
        box.innerHTML = '<p class="settled">Applied. ' +
          'instructions.md has changed — that\'s the second loop closing.</p>';
        scroll();
      });
      box.querySelector('.veto').addEventListener('click', () => {
        box.innerHTML = '<p class="settled">Vetoed. Nothing was written, ' +
          'and it will not ask again.</p>';
        scroll();
      });
      panel.appendChild(box);
    }

    turns.appendChild(panel);
    scroll();
  }

  // The app has no window of its own, so this is where quitting lives.
  document.getElementById('quit').addEventListener('click', async () => {
    try { await post('/quit'); } catch (e) { /* it stops mid-reply; expected */ }
    document.body.innerHTML =
      '<div style="margin:auto;color:#6b6b66;font:17px/1.6 -apple-system,sans-serif">' +
      'The coach has stopped. You can close this window.</div>';
    document.body.style.alignItems = 'center';
    document.body.style.justifyContent = 'center';
  });

  // Which build is running. The app updates itself without telling you,
  // so this is the only way to answer "did that actually change anything?"
  fetch('/build').then(r => r.json()).then(b => {
    document.getElementById('build').textContent = 'build ' + b.build;
    document.getElementById('build').title = 'model: ' + b.model;
  }).catch(() => {});

  speak('');   // the opening question — L4's first lap
</script>
